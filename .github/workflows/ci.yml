name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y shellcheck tmux
      - run: CI=1 tests/lint.sh
      - run: tests/run.sh
      - run: tests/secrets.sh
      - run: tests/policy.sh
  macos:
    # macOS ships bash 3.2 and BSD tools: this is the portability check
    # GitHub-hosted runners only: other forges (Forgejo/Gitea) have no macOS runner, so skip there instead of waiting forever
    # runs-on falls back to a Linux label elsewhere so a runner can pick the job up and evaluate the if (a job nobody can pick up never gets skipped)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ${{ github.server_url == 'https://github.com' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install tmux
      - run: /bin/bash --version | head -1
      - run: tests/run.sh
      - run: tests/secrets.sh
      - run: tests/policy.sh
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanners (sha256-verified)
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLO https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks_8.30.1_linux_x64.tar.gz \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 actionlint_1.7.12_linux_amd64.tar.gz \
            bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b zizmor-x86_64-unknown-linux-gnu.tar.gz | sha256sum -c -
          sudo tar xzf gitleaks_8.30.1_linux_x64.tar.gz -C /usr/local/bin gitleaks
          sudo tar xzf actionlint_1.7.12_linux_amd64.tar.gz -C /usr/local/bin actionlint
          sudo tar xzf zizmor-x86_64-unknown-linux-gnu.tar.gz -C /usr/local/bin zizmor
      - name: gitleaks (tree and full history; findings are redacted in the log)
        run: gitleaks git --no-banner --redact --exit-code 1 .
      - name: actionlint
        run: actionlint
      - name: zizmor (workflow security audit)
        run: zizmor --offline --min-severity medium .github/workflows
